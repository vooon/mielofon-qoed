[bumpversion]
current_version = 0.15.0
commit = True
tag = True
tag_name = v{new_version}

[bumpversion:file:mielofon-controller/Makefile]
search = PKG_VERSION:={current_version}
replace = PKG_VERSION:={new_version}

[bumpversion:file:mielofon-agent/Makefile]
search = PKG_VERSION:={current_version}
replace = PKG_VERSION:={new_version}

[bumpversion:file:Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(agent):Cargo.lock]
search = name = "mielofon-agent"
	version = "{current_version}"
replace = name = "mielofon-agent"
	version = "{new_version}"

[bumpversion:file(controller):Cargo.lock]
search = name = "mielofon-controller"
	version = "{current_version}"
replace = name = "mielofon-controller"
	version = "{new_version}"

[bumpversion:file(otel):Cargo.lock]
search = name = "mielofon-otel"
	version = "{current_version}"
replace = name = "mielofon-otel"
	version = "{new_version}"

[bumpversion:file(proto):Cargo.lock]
search = name = "mielofon-proto"
	version = "{current_version}"
replace = name = "mielofon-proto"
	version = "{new_version}"
