# Mielofon controller configuration (SANITIZED example).
#
# All identifiers below are PLACEHOLDERS using RFC-private documentation
# addresses and generic node names. Rewrite for your environment; never
# publish real hostnames/IPs/ASNs.

[node]
name = "hub-a"           # placeholder node name
advertise = "203.0.113.1" # RFC 5737 documentation address

[cluster]
grace_ttl_secs = 300
gossip_interval_secs = 5

[members]
"hub-a" = "203.0.113.1"
"hub-b" = "203.0.113.2"
"hub-c" = "203.0.113.3"
"hub-d" = "203.0.113.4"
"hub-e" = "198.51.100.9"

[listeners]
# cluster = mTLS node-to-node gossip (etcd-style cluster endpoint, default 9551)
# client  = mTLS agent API          (etcd-style client endpoint,  default 9552)
# admin   = loopback dashboard + /metrics + /healthz + /readyz    (default 9553)

[tls]
ca = "/etc/mielofon/ca.pem"
cert = "/etc/mielofon/node.pem"
key = "/etc/mielofon/node.key"

# Quality classes. Each class pins only the dimensions it wants to enforce
# (unset = not constraining): rtt_ms/loss_pct are upper bounds (≤ is ok),
# rr_tps/tcp_mbps are lower bounds (≥ is ok). A link gets the worst class
# whose threshold it crosses; ospf_cost is advertised for links in that class.
[quality.good]
rtt_ms = 40
loss_pct = 1.0
rr_tps = 50.0
tcp_mbps = 10.0
ospf_cost = 10

[quality.acceptable]
rtt_ms = 90
loss_pct = 2.5
rr_tps = 35.0
tcp_mbps = 5.0
ospf_cost = 20

[quality.poor]
rtt_ms = 250
loss_pct = 5.0
rr_tps = 20.0
tcp_mbps = 2.0
ospf_cost = 50

[quality.bad]
rtt_ms = 500
loss_pct = 10.0
rr_tps = 10.0
tcp_mbps = 1.0
ospf_cost = 100

# Observability. OTLP/HTTP (no gRPC). A signal exports only when it is enabled
# AND its resolved endpoint (per-signal override, else the global endpoint) is
# non-empty. Leave everything unset/empty to disable.
[otel]
enabled = true
endpoint = ""            # optional global endpoint, e.g. "http://127.0.0.1:4318"

