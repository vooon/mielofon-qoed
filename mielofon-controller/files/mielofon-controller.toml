# Mielofon controller configuration (SANITIZED example).
#
# All identifiers below are PLACEHOLDERS using RFC-private documentation
# addresses and generic node names. Rewrite for your environment; never
# publish real hostnames/IPs/ASNs.

[node]
name = "hub-a"           # placeholder node name; peers reach it via [members]

[cluster]
grace_ttl_secs = 300
gossip_interval_secs = 5

[members]
"hub-a" = "203.0.113.1"
"hub-b" = "203.0.113.2"
"hub-c" = "203.0.113.3"
"hub-d" = "203.0.113.4"
"hub-e" = "198.51.100.9"

[listeners]
# cluster = mTLS QUIC node-to-node gossip      (etcd-style cluster endpoint, default 9551/udp)
# client  = mTLS QUIC agent sessions         (etcd-style client endpoint,  default 9552/udp)
# admin   = loopback dashboard + /metrics + /healthz + /readyz + tooling ingest (default 9553/tcp)

[tls]
ca = "/etc/mielofon/ca.pem"
cert = "/etc/mielofon/node.pem"
key = "/etc/mielofon/node.key"

# Quality classes. Each class pins only the dimensions it wants to enforce
# (unset = not constraining): rtt_ms/loss_pct/jitter_ms are upper bounds
# (≤ is ok), tcp_mbps is a lower bound (≥ is ok). A link gets the worst class
# whose threshold it crosses; ospf_cost is advertised for links in that class.
#
# The agents' gated UDP leg (a fixed-rate stream, see the agent's
# udp_rate_mbps) adds udp_mbps (lower bound), udp_loss_pct and udp_jitter_ms
# (upper bounds). They are unset here, so the leg is informational until you
# pin them, e.g. `udp_loss_pct = 2.0` on [quality.poor].
#
# jitter_ms is the always-tier congestion signal, derived from the ping RTT
# distribution (iputils mdev). It is non-intrusive and congestion-immune: it
# rises under bufferbloat/queueing before the average RTT crosses a class, and
# is upper-bounded below the rtt cutoffs. Strictness is tempered by the
# classifier's hysteresis.
[quality.good]
rtt_ms = 40
loss_pct = 1.0
jitter_ms = 5.0
tcp_mbps = 10.0
ospf_cost = 10

[quality.acceptable]
rtt_ms = 90
loss_pct = 2.5
jitter_ms = 15.0
tcp_mbps = 5.0
ospf_cost = 20

[quality.poor]
rtt_ms = 250
loss_pct = 5.0
jitter_ms = 40.0
tcp_mbps = 2.0
ospf_cost = 50

[quality.bad]
rtt_ms = 500
loss_pct = 10.0
jitter_ms = 100.0
tcp_mbps = 1.0
ospf_cost = 100

# Policy classifier. Classification is decoupled from measurement: probe
# replies are appended to the replicated time-series store, and this loop
# re-derives each link's quality/cost from a window of recent samples.
# `always_fresh_secs` bounds how fresh the rtt/loss/jitter must be; the gated
# throughput dim is used fresh within `tcp_fresh_secs` and carried (last-known)
# within `tcp_carry_secs`, so a busy/skipped throughput probe does not blank
# mbps from classification. `busy_hold_secs` keeps a busy link's last cost
# instead of reclassifying it as degraded; a window with no rtt/loss/jitter at
# all keeps the last cost too. `hysteresis_passes` requires a new
# class to be observed that many consecutive passes before it is applied, so a
# single noisy sample cannot flip the cost.
# `pair_cost` combines the two directions of one tunnel (A->B and B->A, matched
# by swapped node names): "directional" takes the worse rtt/loss/jitter of both
# ends and each direction's own throughput, so the halves only get different
# costs when throughput really differs by direction; "symmetric" also takes the
# worse throughput, so both halves always get the same cost; "off" classifies
# each direction on its own.
#
# `hub_spoke_cost_offset` is added to the cost a hub ([members] entry)
# advertises towards a non-member, so spokes never carry transit between
# hubs: a hub->spoke->hub detour always loses to a direct hub<->hub link,
# while the spoke keeps a finite, quality-ranked fallback. Spoke->hub and
# hub<->hub links are costed by class alone.
[classifier]
interval_secs = 5
always_fresh_secs = 60
tcp_fresh_secs = 1200
tcp_carry_secs = 3600
busy_hold_secs = 120
hysteresis_passes = 3
pair_cost = "directional"
hub_spoke_cost_offset = 1000

# Console logging. `level` sets the minimum tracing level emitted to the
# console; `format` selects the console output (logfmt, json, or syslog for
# a procd-fed stderr: no timestamp, target or colour). Both are
# independent of the per-signal OTEL levels below.
[log]
level = "info"
format = "logfmt"

# Time-series history (per-link raw samples + 60s aggregates, replicated via
# gossip). `path` enables the durable embedded redb file; an empty path keeps
# history in memory only (lost on restart). Keep it outside /etc/mielofon,
# which is configuration (conffiles, sysupgrade backups). On OpenWrt /var is
# tmpfs: point it at persistent storage (e.g. a data partition) to keep
# history across reboots.
[ts]
path = "/var/lib/mielofon/tsdb.redb"
raw_retention_secs = 7200
agg_retention_secs = 86400

# Frontend dashboard. `root_dir` is where the package installs the built Vue
# SPA (index.html + assets/, including the bundled vis-network library); the
# daemon serves these files from disk at runtime.
[frontend]
root_dir = "/usr/share/mielofon/dashboard"

# Observability. OTLP/HTTP (no gRPC). A signal exports only when it is enabled
# AND its resolved endpoint (per-signal override, else the global endpoint) is
# non-empty. Leave everything unset/empty to disable. Each signal forwards at
# its own `level` (fallback: the console level above), so you can e.g. emit
# info to the console but forward debug logs to the collector.
[otel]
enabled = true
endpoint = ""            # optional global endpoint, e.g. "http://127.0.0.1:4318"

# [otel.traces]
