# Mielofon controller configuration (SANITIZED example).
#
# All identifiers below are PLACEHOLDERS using RFC-private documentation
# addresses and generic node names. Rewrite for your environment; never
# publish real hostnames/IPs/ASNs.

[node]
name = "hub-a"           # placeholder node name
advertise = "203.0.113.1" # RFC 5737 documentation address

[cluster]
grace_ttl_secs = 300
gossip_interval_secs = 5

[members]
"hub-a" = "203.0.113.1"
"hub-b" = "203.0.113.2"
"hub-c" = "203.0.113.3"
"hub-d" = "203.0.113.4"
"hub-e" = "198.51.100.9"

[listeners]
# cluster = mTLS node-to-node gossip (etcd-style cluster endpoint, default 9551)
# client  = mTLS agent API          (etcd-style client endpoint,  default 9552)
# admin   = loopback dashboard + /metrics + /healthz + /readyz    (default 9553)

[tls]
ca = "/etc/mielofon/ca.pem"
cert = "/etc/mielofon/node.pem"
key = "/etc/mielofon/node.key"

# Quality classes. Each class pins only the dimensions it wants to enforce
# (unset = not constraining): rtt_ms/loss_pct are upper bounds (≤ is ok),
# rr_tps/tcp_mbps are lower bounds (≥ is ok). A link gets the worst class
# whose threshold it crosses; ospf_cost is advertised for links in that class.
#
# rr_tps is calibrated 1:1 to the rtt cutoffs (25/11/4/2 ≈ 1000/rtt at
# 40/90/250/500 ms): netperf TCP_RR is lockstep, so the rate is capped at
# ~1000/rtt and rr is a latency cross-check, not a multi-stream throughput.
[quality.good]
rtt_ms = 40
loss_pct = 1.0
rr_tps = 25.0
tcp_mbps = 10.0
ospf_cost = 10

[quality.acceptable]
rtt_ms = 90
loss_pct = 2.5
rr_tps = 11.0
tcp_mbps = 5.0
ospf_cost = 20

[quality.poor]
rtt_ms = 250
loss_pct = 5.0
rr_tps = 4.0
tcp_mbps = 2.0
ospf_cost = 50

[quality.bad]
rtt_ms = 500
loss_pct = 10.0
rr_tps = 2.0
tcp_mbps = 1.0
ospf_cost = 100

# Policy classifier. Classification is decoupled from measurement: probe
# replies are appended to the replicated time-series store, and this loop
# re-derives each link's quality/cost from a window of recent samples.
# `always_fresh_secs` bounds how fresh the rtt/loss/rr must be; the gated
# throughput dim is used fresh within `tcp_fresh_secs` and carried (last-known)
# within `tcp_carry_secs`, so a busy/skipped throughput probe does not blank
# mbps from classification. `busy_hold_secs` keeps a busy link's last cost
# instead of reclassifying it as degraded.
[classifier]
interval_secs = 5
always_fresh_secs = 60
tcp_fresh_secs = 1200
tcp_carry_secs = 3600
busy_hold_secs = 120

# Console logging. `level` sets the minimum tracing level emitted to the
# console; `format` selects the console output (logfmt or JSON). Both are
# independent of the per-signal OTEL levels below.
[log]
level = "info"
format = "logfmt"

# Time-series history (per-link raw samples + 60s aggregates, replicated via
# gossip). `path` enables the durable embedded redb file; an empty path keeps
# history in memory only (lost on restart).
[ts]
path = "/etc/mielofon/tsdb.redb"
raw_retention_secs = 7200
agg_retention_secs = 86400

# Frontend dashboard. `root_dir` is where the package installs the built Vue
# SPA (index.html + assets/, including the bundled vis-network library); the
# daemon serves these files from disk at runtime.
[frontend]
root_dir = "/usr/share/mielofon/dashboard"

# Observability. OTLP/HTTP (no gRPC). A signal exports only when it is enabled
# AND its resolved endpoint (per-signal override, else the global endpoint) is
# non-empty. Leave everything unset/empty to disable. Each signal forwards at
# its own `level` (fallback: the console level above), so you can e.g. emit
# info to the console but forward debug logs to the collector.
[otel]
enabled = true
endpoint = ""            # optional global endpoint, e.g. "http://127.0.0.1:4318"

# [otel.traces]
# enabled = true
# endpoint = "http://127.0.0.1:4318/v1/traces"
# level = "info"

# [otel.metrics]
# enabled = true
# endpoint = "http://127.0.0.1:4318/v1/metrics"

# [otel.logs]
