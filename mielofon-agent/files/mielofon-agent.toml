# Mielofon agent configuration (SANITIZED example).
#
# The agent is a thin executor: it registers its links, polls the controller
# for work, runs the probes it is told to run, and applies the costs it is
# told to apply. All addresses below are placeholders (RFC 5737 / RFC 3849).

[agent]
name = "spoke-1"
controller = "203.0.113.1"    # controller clients listener (mTLS)
controller_port = 9552

[tls]
ca = "/etc/mielofon/ca.pem"
cert = "/etc/mielofon/agent.pem"
key = "/etc/mielofon/agent.key"

[loop]
poll_secs = 2

[probes]
ping_count = 3
ping_interval = 0.2
rr_duration = 4
tcp_duration = 4
quiet_max_mbps = 15.0

[[links]]
# The controller only references this link by {from,to,interface}; the probe
# target/source are device-local and never leave the router.
from = "spoke-1"
to = "hub-a"
interface = "awg_hub_a"
target = "2001:db8::1"        # placeholder — peer loopback via this link
# source = "2001:db8::10"     # optional source bind to pin the link
# cost_command = "/etc/mielofon/apply-cost.sh {interface} {cost}"

# [[links]]
# from = "spoke-1"
# to = "hub-b"
# interface = "awg_hub_b"
# target = "2001:db8::2"

# Observability (optional). OTLP/HTTP; leave endpoint empty to disable.
[otel]
enabled = false
endpoint = ""