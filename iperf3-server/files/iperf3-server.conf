# iperf3 servers for the mesh (one procd instance per `server` section).
#
# Each node runs one listener per entry, so TCP and UDP throughput probes can
# use different ports (or the same port for both, since iperf3 serves both
# protocols, if you only need one entry). Every server is jailed under ujail
# by default (`jail 1`).

# TCP throughput listener. Keep `port` in sync with the agent's `iperf_port`.
config server 'tcp'
	option enabled '1'
	option protocol 'tcp'
	option port '5201'
	# Optional bind address (default: all interfaces, i.e. the awg* links
	# included). Usually left empty.
	# option bind 'fd00:0:0:1::40:0'
	# Extra iperf3 flags passed through (e.g. '5' for 5 parallel streams).
	# option extra ''
	option jail '1'

# UDP throughput listener on a second port (the gated UDP leg of the probe).
# Disabled by default; enable and match the agent's UDP port when used.
# config server 'udp'
# 	option enabled '1'
# 	option protocol 'udp'
# 	option port '5202'
# 	option jail '1'