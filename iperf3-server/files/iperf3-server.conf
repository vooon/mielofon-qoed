
config server 'main'
	option enabled '1'
	# Port for iperf3 -s. Keep in sync with the agent's `iperf_port`.
	option port '5201'
	# Optional bind address (default: all interfaces, i.e. the awg* links
	# included). Usually left empty.
	# option bind 'fd00:0:0:1::40:0'
	# Extra iperf3 flags passed through (e.g. '5' for 5 parallel streams).
	# option extra ''
