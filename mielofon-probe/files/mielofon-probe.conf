config daemon 'daemon'
	option enabled '1'
	# Prometheus textfile (node-exporter textfile collector), rewritten
	# atomically. The parent directory is mounted rw into the jail.
	option textfile '/run/prometheus/textfile/mielofon-probe.prom'
	# Syslog level: emerg..debug.
	option log_level 'info'
	# Run under ujail (always recommended; disable only for debugging).
	option jail '1'