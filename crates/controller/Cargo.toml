[package]
name = "mielofon-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mielofon distributed QoE coordination controller daemon"

[[bin]]
name = "mielofon-controller"
path = "src/main.rs"

[dependencies]
mielofon-otel = { workspace = true }
mielofon-proto = { workspace = true }
mielofon-transport = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
redb = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dependencies.rustls]
workspace = true
features = ["ring"]

[dependencies.rustls-pemfile]
workspace = true

[dev-dependencies]
mielofon-transport = { workspace = true, features = ["testpki"] }
tower = { workspace = true }
tokio = { workspace = true, features = ["full"] }
http-body-util = "0.1"
axum = { workspace = true, features = ["http1", "tokio"] }
