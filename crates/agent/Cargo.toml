[package]
name = "mielofon-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mielofon node agent: link discovery, probing and OSPF cost execution"

[[bin]]
name = "mielofon-agent"
path = "src/main.rs"

[dependencies]
mielofon-otel = { workspace = true }
mielofon-proto = { workspace = true }
mielofon-transport = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rustls-pemfile = { workspace = true }
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"

[dependencies.rustls]
workspace = true
features = ["ring"]
