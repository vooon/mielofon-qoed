[package]
name = "mielofon-otel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared OpenTelemetry (OTLP/HTTP, gRPC-free) setup for mielofon daemons"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["reqwest-blocking-client", "http-proto"] }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
