[package]
name = "mielofon-otel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared OpenTelemetry (OTLP/HTTP, gRPC-free) setup for mielofon daemons"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["reqwest-blocking-client", "http-proto"] }
# opentelemetry-otlp pulls reqwest without default features, i.e. without
# any TLS backend, so an `https://` collector endpoint fails with "network
# error". rustls through the platform verifier (system CA bundle); the
# provider is the ring one each daemon installs at start.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring"] }
