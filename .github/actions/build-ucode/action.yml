name: Build / restore pinned ucode
description: >
  Build (or restore from cache) the ucode revision that OpenWrt 25.12 ships,
  including its upstream modules. The revision comes from
  scripts/build-ucode.sh (single source of truth); the cache key follows it so
  bumping the SHA invalidates the cache.
inputs: {}
outputs:
  bin:
    description: path to the ucode binary
    value: ${{ steps.paths.outputs.bin }}
  mods:
    description: directory containing the built module .so files
    value: ${{ steps.paths.outputs.mods }}
runs:
  using: composite
  steps:
    - id: id
      shell: bash
      run: |
        sha="$(sed -n 's/.*UCODE_SHA="\([0-9a-f]\{40\}\)".*/\1/p' "${GITHUB_WORKSPACE}/scripts/build-ucode.sh")"
        echo "cache-key=ucode-${sha}" >> "${GITHUB_OUTPUT}"

    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: ${{ runner.temp }}/ucode-build
        key: ${{ steps.id.outputs.cache-key }}

    - name: Build pinned ucode
      id: build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: sh "${GITHUB_WORKSPACE}/scripts/build-ucode.sh" "${{ runner.temp }}/ucode-build"

    - name: Save ucode cache
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ucode-build
        key: ${{ steps.id.outputs.cache-key }}

    - id: paths
      shell: bash
      run: |
        echo "bin=${{ runner.temp }}/ucode-build/src/build/ucode" >> "${GITHUB_OUTPUT}"
        echo "mods=${{ runner.temp }}/ucode-build/src/build" >> "${GITHUB_OUTPUT}"