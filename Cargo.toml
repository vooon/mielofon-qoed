[workspace]
resolver = "2"
members = [
    "crates/mielofon-otel",
    "crates/controller",
]
default-members = ["crates/controller"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vooon/mielofon-qoed"

[workspace.dependencies]
mielofon-otel = { path = "crates/mielofon-otel" }

# Async runtime / HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# TLS (pure Rust, static-musl friendly)
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "native-tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Prometheus metrics
prometheus = "0.14"

# OpenTelemetry (OTLP/HTTP only, gRPC-free)
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs", "rt-tokio"] }
# Blocking HTTP client on purpose: the non-experimental Batch*Processors and
# PeriodicReader drive exporters from plain std threads via
# futures_executor::block_on, so an async (reqwest-client) client panics with
# "there is no reactor running". The blocking client works anywhere.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry-semantic-conventions = "0.32"

# Error / libc
thiserror = "2"
anyhow = "1"
